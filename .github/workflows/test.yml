name: test

on:
  push:
  pull_request:

jobs:
  unit:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.x", "24.x"]
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: node bin/setup.mjs --help
      - run: npm pack --dry-run

  live:
    # Optional integration test against the real CAIL gateway. Runs only when
    # a repository secret is configured; never needed for ordinary CI.
    name: live CAIL integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cail-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run test:live
        env:
          CAIL_LIVE_TEST_KEY: ${{ secrets.CAIL_LIVE_TEST_KEY }}
